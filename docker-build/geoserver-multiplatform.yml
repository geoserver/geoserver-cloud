services:
  wfs:
    extends:
      file: templates.yml
      service: multi-platform
    image: ${REPOSITORY}/geoserver-cloud-wfs:${TAG}
    build:
      context: ../src/apps/geoserver/wfs/
      labels:
        org.opencontainers.image.title: GeoServer Cloud WFS
        org.opencontainers.image.description: Web Feature Service of GeoServer Cloud

  wms:
    extends:
      file: templates.yml
      service: multi-platform
    image: ${REPOSITORY}/geoserver-cloud-wms:${TAG}
    build:
      context: ../src/apps/geoserver/wms/
      labels:
        org.opencontainers.image.title: GeoServer Cloud WMS
        org.opencontainers.image.description: Web Map Service of GeoServer Cloud

  wcs:
    extends:
      file: templates.yml
      service: multi-platform
    image: ${REPOSITORY}/geoserver-cloud-wcs:${TAG}
    build:
      context: ../src/apps/geoserver/wcs/
      labels:
        org.opencontainers.image.title: GeoServer Cloud WCS
        org.opencontainers.image.description: Web Coverage Service of GeoServer Cloud

  wps:
    extends:
      file: templates.yml
      service: multi-platform
    image: ${REPOSITORY}/geoserver-cloud-wps:${TAG}
    build:
      context: ../src/apps/geoserver/wps/
      labels:
        org.opencontainers.image.title: GeoServer Cloud WPS
        org.opencontainers.image.description: Web Processing Service of GeoServer Cloud

  restconfig:
    extends:
      file: templates.yml
      service: multi-platform
    image: ${REPOSITORY}/geoserver-cloud-rest:${TAG}
    build:
      context: ../src/apps/geoserver/restconfig/
      labels:
        org.opencontainers.image.title: GeoServer Cloud REST configuration
        org.opencontainers.image.description: REST configuration API of GeoServer Cloud

  webui:
    extends:
      file: templates.yml
      service: multi-platform
    image: ${REPOSITORY}/geoserver-cloud-webui:${TAG}
    build:
      context: ../src/apps/geoserver/webui/
      labels:
        org.opencontainers.image.title: GeoServer Cloud web UI
        org.opencontainers.image.description: Web administration interface of GeoServer Cloud

  gwc:
    extends:
      file: templates.yml
      service: multi-platform
    image: ${REPOSITORY}/geoserver-cloud-gwc:${TAG}
    build:
      context: ../src/apps/geoserver/gwc/
      labels:
        org.opencontainers.image.title: GeoServer Cloud GeoWebCache
        org.opencontainers.image.description: GeoWebCache tile services of GeoServer Cloud

    
