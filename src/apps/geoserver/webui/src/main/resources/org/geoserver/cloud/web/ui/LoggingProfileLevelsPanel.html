<html xmlns:wicket="http://wicket.apache.org/">
<body>
<wicket:panel>
  <div class="logging-profile-levels">
    <p wicket:id="description">Levels set by this profile</p>
    <table>
      <tbody>
        <tr wicket:id="levels">
          <td wicket:id="logger">org.geoserver</td>
          <td wicket:id="level">WARN</td>
        </tr>
      </tbody>
    </table>
  </div>
</wicket:panel>
</body>
</html>
